<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="50%" stop-color="#141026"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)"/>

  <g opacity="0.12">
    <circle cx="200" cy="160" r="2" fill="#818cf8"/>
    <circle cx="300" cy="120" r="2" fill="#a78bfa"/>
    <circle cx="400" cy="180" r="2" fill="#818cf8"/>
    <circle cx="500" cy="140" r="2" fill="#6366f1"/>
    <circle cx="600" cy="170" r="2" fill="#818cf8"/>
    <circle cx="150" cy="240" r="2" fill="#a78bfa"/>
    <circle cx="650" cy="220" r="2" fill="#818cf8"/>
  </g>

  <ellipse cx="400" cy="220" rx="300" ry="100" fill="url(#glow2)" filter="url(#blur2)"/>

  <g transform="translate(280,120)">
    <circle cx="120" cy="120" r="100" fill="none" stroke="url(#accent2)" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="120" cy="120" r="40" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.3"/>

    <g stroke="url(#accent2)" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="120" y1="20" x2="120" y2="60"/>
      <line x1="120" y1="180" x2="120" y2="220"/>
      <line x1="20" y1="120" x2="60" y2="120"/>
      <line x1="180" y1="120" x2="220" y2="120"/>
      <line x1="55" y1="55" x2="80" y2="80"/>
      <line x1="185" y1="185" x2="160" y2="210"/>
      <line x1="55" y1="185" x2="80" y2="160"/>
      <line x1="185" y1="55" x2="160" y2="80"/>
    </g>

    <g fill="url(#accent2)">
      <circle cx="120" cy="20" r="4"/>
      <circle cx="120" cy="220" r="4"/>
      <circle cx="20" cy="120" r="4"/>
      <circle cx="220" cy="120" r="4"/>
      <circle cx="55" cy="55" r="3"/>
      <circle cx="185" cy="185" r="3"/>
      <circle cx="55" cy="185" r="3"/>
      <circle cx="185" cy="55" r="3"/>
    </g>

    <circle cx="120" cy="120" r="6" fill="#818cf8"/>
  </g>

  <g opacity="0.08">
    <rect x="120" y="340" width="560" height="2" fill="#818cf8"/>
    <rect x="120" y="380" width="480" height="2" fill="#6366f1"/>
    <rect x="120" y="420" width="400" height="2" fill="#4f46e5"/>
  </g>

  <text x="60" y="440" fill="#818cf8" font-family="monospace" font-size="13" letter-spacing="3">DOTNET-02</text>
  <text x="740" y="440" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">.NET DEVELOPMENT</text>
</svg>