<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <g opacity="0.12">
    <circle cx="200" cy="140" r="3" fill="#3b82f6"/>
    <circle cx="300" cy="100" r="2" fill="#1d4ed8"/>
    <circle cx="400" cy="160" r="3" fill="#3b82f6"/>
    <circle cx="500" cy="120" r="2" fill="#1d4ed8"/>
    <circle cx="600" cy="150" r="3" fill="#3b82f6"/>
    <circle cx="150" cy="220" r="2" fill="#1d4ed8"/>
    <circle cx="650" cy="200" r="3" fill="#3b82f6"/>
  </g>

  <ellipse cx="400" cy="200" rx="300" ry="100" fill="url(#glow)" filter="url(#blur)"/>

  <g transform="translate(280,110)">
    <path d="M40 120 Q40 60 120 60 T200 120 T120 180 T40 120" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.8"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

    <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="80" y1="120" x2="160" y2="120"/>
      <line x1="120" y1="80" x2="120" y2="160"/>
    </g>

    <g fill="url(#accent)">
      <circle cx="120" cy="60" r="5"/>
      <circle cx="120" cy="180" r="5"/>
      <circle cx="40" cy="120" r="5"/>
      <circle cx="200" cy="120" r="5"/>
    </g>

    <circle cx="120" cy="120" r="8" fill="#3b82f6"/>
  </g>

  <g opacity="0.08">
    <rect x="120" y="340" width="560" height="2" fill="#3b82f6"/>
    <rect x="120" y="380" width="480" height="2" fill="#1d4ed8"/>
    <rect x="120" y="420" width="400" height="2" fill="#1e40af"/>
  </g>

  <text x="60" y="440" fill="#3b82f6" font-family="monospace" font-size="13" letter-spacing="3">DEVOPS-01</text>
  <text x="740" y="440" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="end">DEVOPS &amp; CLOUD</text>
</svg>